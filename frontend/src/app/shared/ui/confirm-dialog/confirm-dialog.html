<dialog
  #dialogEl
  class="confirm-dialog"
  aria-labelledby="confirm-dialog-title"
  aria-describedby="confirm-dialog-message"
  (cancel)="$event.preventDefault(); onCancel()"
>
  <h2 id="confirm-dialog-title" class="confirm-dialog__title">{{ title() }}</h2>
  <p id="confirm-dialog-message" class="confirm-dialog__message">{{ message() }}</p>
  <div class="confirm-dialog__actions">
    <app-button variant="secondary" [disabled]="busy()" (click)="onCancel()">{{
      cancelLabel()
    }}</app-button>
    <app-button
      [variant]="danger() ? 'danger' : 'primary'"
      [loading]="busy()"
      (click)="onConfirm()"
    >
      {{ confirmLabel() }}
    </app-button>
  </div>
</dialog>
