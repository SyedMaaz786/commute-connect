@if (totalPages() > 1) {
  <nav class="pagination" aria-label="Pagination">
    <button
      type="button"
      class="pagination__btn"
      [disabled]="!canGoPrevious()"
      (click)="goTo(page() - 1)"
    >
      Previous
    </button>
    <span class="pagination__status">Page {{ page() }} of {{ totalPages() }}</span>
    <button
      type="button"
      class="pagination__btn"
      [disabled]="!canGoNext()"
      (click)="goTo(page() + 1)"
    >
      Next
    </button>
  </nav>
}
